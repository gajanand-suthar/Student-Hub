<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Migrating Account — Student Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .migrate-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <div class="migrate-card">
    <div class="spinner" style="margin: 0 auto 16px;"></div>
    <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:8px">Migrating Account...</h2>
    <p style="font-size:0.85rem;color:var(--muted)" id="msg">Saving your credentials securely...</p>
  </div>

  <script type="module">
    import { CONFIG } from '../js/config.js';

    function runMigration() {
      const msg = document.getElementById('msg');
      try {
        const params = new URLSearchParams(window.location.search);
        const data = params.get('data');
        const hash = window.location.hash.slice(1);

        let payload = null;
        if (data) {
          payload = JSON.parse(decodeURIComponent(atob(data)));
        } else if (hash) {
          payload = JSON.parse(decodeURIComponent(atob(hash)));
        }

        if (payload && payload.usn) {
          localStorage.setItem(CONFIG.CRED_KEY, JSON.stringify(payload));
          if (payload.token) {
            localStorage.setItem(CONFIG.TOKEN_KEY, payload.token);
          }
          if (msg) msg.textContent = 'Account migration complete! Redirecting...';
          setTimeout(() => window.location.replace('../'), 1000);
          return;
        }
      } catch (e) {
        if (msg) msg.textContent = 'Could not parse migration data.';
      }

      setTimeout(() => window.location.replace('../'), 2000);
    }

    document.addEventListener('DOMContentLoaded', runMigration);
  </script>
</body>
</html>
